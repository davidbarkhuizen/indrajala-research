# Builds every LaTeX document (papers/, research-notes/) with the repository's Makefile; a LaTeX
# error or any undefined reference or citation fails it. The bibliography of other people's work
# is the private indrajala-literature repository, read with a read-only deploy key
# (LITERATURE_DEPLOY_KEY). The PDFs are kept as the run's artifact.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  latex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # a hung install or build fails rather than holding a runner for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: davidbarkhuizen/indrajala-literature
          ssh-key: ${{ secrets.LITERATURE_DEPLOY_KEY }}
          path: indrajala-literature
          sparse-checkout: library.bib
          sparse-checkout-cone-mode: false
      # The TeX packages' .debs are cached (keyed on the package list and the runner image), so a run
      # installs from the cache, not the mirror: on 2026-10-23 a slow mirror held the download past the
      # timeout twice. A changed list or image misses once and refills the cache.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: tex-debs-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: tex-debs-${{ runner.os }}-
      - name: TeX
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" \
            texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra lmodern latexmk
          sudo chown -R "$USER" ~/apt-archives  # apt writes as root; the cache step saves as the runner
      - name: Build
        run: make -j4 LITERATURE=indrajala-literature
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            papers/*.pdf
            research-notes/*.pdf
